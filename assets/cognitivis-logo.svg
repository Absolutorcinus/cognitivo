<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Cognitivis logo</title>
  <desc id="desc">Stylized gradient brain split into two halves with neural pathways</desc>
  <defs>
